name: Dependency refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install astro@7.2.8 sharp@0.35.4 --save-exact
      - run: npm audit fix --package-lock-only
      - run: npm ci
      - run: npm run build
      - run: npm run check:site
      - run: npm run check:seo
      - run: npm run check:form
      - run: npm run check:images
      - run: npm run check:locales
      - name: Commit refreshed dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update vulnerable build dependencies"
          git push
