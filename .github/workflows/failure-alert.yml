name: Workflow Failure Alert

on:
  workflow_run:
    workflows: ["CTSEG Automated B2B Lead Scraper & CRM Sync", "AI Content Factory & SEO Publisher", "Mythborn Community & Devlog Sync", "Advanced Security & Dependency Audit"]
    types:
      - completed

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Send Webhook Alert
        run: |
          echo "Workflow failed! Sending alert for workflow: ${{ github.event.workflow_run.name }}"
          # Burada Discord veya Telegram Webhook API çağrısı yapılabilir:
          # curl -X POST -H "Content-Type: application/json" -d '{"content":"⚠️ Otomasyon Hatası: ${{ github.event.workflow_run.name }} başarısız oldu!"}' ${{ secrets.WEBHOOK_URL }}
          echo "Alert notification simulation completed."
