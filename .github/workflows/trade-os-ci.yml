name: Trade OS CI

on:
  push:
    branches: [trade-os]
    paths:
      - ".github/workflows/trade-os-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: trade-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
