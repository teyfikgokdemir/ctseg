name: Trade OS CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTHORIZED_EMAILS: ci@example.com
      PRIMARY_ADMIN_EMAIL: ci@example.com
      DEV_USER_EMAIL: ci@example.com
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: https://example.cloudflareaccess.com
      CLOUDFLARE_ACCESS_AUD: ci-audience
    defaults:
      run:
        working-directory: trade-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run build
