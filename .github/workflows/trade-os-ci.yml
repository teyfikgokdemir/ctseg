name: Trade OS CI

on:
  push:
    branches: [trade-os]
    paths:
      - ".github/workflows/trade-os-ci.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTHORIZED_EMAILS: ci@example.com
      PRIMARY_ADMIN_EMAIL: ci@example.com
      DEV_USER_EMAIL: ci@example.com
    defaults:
      run:
        working-directory: trade-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate without failing notifications
        shell: bash
        run: |
          set +e
          npm ci >/tmp/ci.log 2>&1
          S1=$?
          npm run db:generate >>/tmp/ci.log 2>&1
          S2=$?
          npm run build >>/tmp/ci.log 2>&1
          S3=$?
          {
            echo "npm_ci=$S1"
            echo "prisma_generate=$S2"
            echo "next_build=$S3"
            echo "--- tail ---"
            tail -80 /tmp/ci.log
          } > ci-status.txt
          exit 0

      - name: Persist validation result
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade-os/ci-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(trade-os): persist silent CI status"
            git push origin HEAD:trade-os
          fi
