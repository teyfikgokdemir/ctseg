name: Trade OS CI

on:
  push:
    branches: [trade-os]
    paths:
      - ".github/workflows/trade-os-ci.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture dependency audit
        shell: bash
        run: |
          npm ci >/tmp/install.log 2>&1 || true
          npm audit --json > ci-audit.json 2>&1 || true
          exit 0
      - name: Persist audit result
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade-os/ci-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(trade-os): persist dependency audit"
            git push origin HEAD:trade-os
          fi
