name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ctseg-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:analytics
      - run: npm run build
      - run: npm run check:site
      - run: npm run check:global
      - run: npm run check:migration
      - run: npm run check:seo
      - run: npm run check:form
      - run: npm run check:images
      - run: npm run check:locales
      - run: npm run check:parity
      - run: npm run check:performance

  visual-qa:
    name: Responsive visual QA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run responsive audit
        run: npm run check:responsive
      - name: Upload global sourcing layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctseg-global-sourcing-visual-qa
          if-no-files-found: warn
          retention-days: 7
          path: |
            .artifacts/visual/desktop-tr-textiles-industry.png
            .artifacts/visual/mobile-tr-textiles-industry.png
            .artifacts/visual/desktop-tr-oem-solution.png
            .artifacts/visual/mobile-tr-oem-solution.png
            .artifacts/visual/desktop-de-oem-solution.png
            .artifacts/visual/mobile-ar-oem-solution.png
            .artifacts/visual/desktop-tr-global-markets.png
            .artifacts/visual/mobile-tr-global-markets.png
            .artifacts/visual/desktop-tr-solutions.png
            .artifacts/visual/desktop-tr-industries.png
