services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: ctseg-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./config:/etc/searxng
      - ./data:/var/cache/searxng
